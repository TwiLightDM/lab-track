name: Go CI V1 - Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Sequential Pipeline
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache: false

      - name: Install dependencies
        run: go mod download

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -l .
            exit 1
          fi

      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          working-directory: src/backend
          skip-cache: true

      - name: Run tests
        run: go test -v ./...

      - name: Build Docker image
        run: docker build --no-cache -t backend:latest .
