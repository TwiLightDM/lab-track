services:
  lab-track-postgres:
    image: postgres:18.6-bookworm
    container_name: lab-track-postgres
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - ./out/pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  lab-track-migrate:
    container_name: lab-track-migrate
    image: migrate/migrate:v4.20.1
    volumes:
      - ./migrations:/migrations

  lab-track-backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: lab-track-backend
    env_file:
      - ./src/backend/.env
      - ./.env
    environment:
      - POSTGRES_HOST=lab-track-postgres
    ports:
      - "9080:8080"
    depends_on:
      - lab-track-postgres
    restart: always

  lab-track-frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: lab-track-frontend
    ports:
      - "5173:4173"
    restart: always
